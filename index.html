<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Discover</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1b1d22;--mut:#6b7280;--acc:#4f8cff;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111318;--card:#1b1e25;--tx:#eceef2;--mut:#9aa1ad;--bd:#2a2e37}}
:root[data-theme=dark]{--bg:#111318;--card:#1b1e25;--tx:#eceef2;--mut:#9aa1ad;--bd:#2a2e37}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--bd)}
form{display:flex;gap:8px}
input[type=url],input[type=text],input[type=search],select{min-width:0;padding:11px 14px;border-radius:24px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
form input,#sbox input{flex:1;width:100%}
#sbox{padding-top:8px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.add{background:var(--acc);color:#fff;border-radius:24px;padding:0 18px;font-weight:600;min-height:42px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:6px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--card);font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chips.tags .chip{font-size:13px;padding:4px 12px}
main{padding:12px;display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
main.compact{grid-template-columns:1fr;gap:8px}
.card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px #0002}
.card.read{opacity:.55}
.card a{color:inherit;text-decoration:none;display:block}
.img{aspect-ratio:16/9;background:var(--bd) center/cover no-repeat}
.compact .card a{display:flex}
.compact .img{width:104px;aspect-ratio:1;flex:none}
.compact .body{flex:1;min-width:0}
.compact h3{font-size:16px;-webkit-line-clamp:2}
.compact p{display:none}
.body{padding:12px 14px 4px}
.src{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:13px}
.src img{width:18px;height:18px;border-radius:50%}
h3{margin:8px 0 4px;font-size:18px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
p{margin:0;color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px 0}
.tg span{font-size:12px;border:1px solid;border-radius:10px;padding:1px 8px;cursor:pointer}
.act{display:flex;justify-content:flex-end;padding:4px 8px 8px}
.act button{padding:8px 10px;font-size:20px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:min(94vw,500px);max-height:88vh;padding:16px}
dialog::backdrop{background:#0008}
dialog h2{margin:0 0 6px;font-size:20px}
dialog h4{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
dialog form{flex-direction:column}
.fr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.fr>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:10px}
.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc)}
.hint{font-size:13px;margin:6px 0}
.rf{display:flex;gap:6px;margin:8px 0}
.rf input{flex:1;padding:9px 12px}
.btn{display:block;width:100%;margin:6px 0;padding:10px;border:1px solid var(--bd);border-radius:24px}
.tm{padding:4px 0 8px;border-bottom:1px solid var(--bd)}
.tm .fr{border:0;padding-bottom:2px}
.tp{border:1px solid;border-radius:10px;padding:1px 10px;font-size:14px}
.swatch{display:flex;gap:10px;flex-wrap:wrap;padding:6px 2px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.dot.sel{border-color:var(--tx)}
.close{margin-top:12px;width:100%;padding:10px;border:1px solid var(--bd);border-radius:24px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 0 30px}
</style>
</head>
<body>
<header>
  <form id="f">
    <input id="u" type="url" inputmode="url" placeholder="Enganxa un enllaç…" autocomplete="off">
    <button class="add">Afegeix</button>
  </form>
  <div id="sbox" hidden><input id="q" type="search" placeholder="Cerca…" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div class="chips tags" id="tags"></div>
</header>
<main id="feed"></main>
<footer>Discover v2.2 · 22/11/2026</footer>
<div id="toast"></div>
<input type="file" id="imp" accept="application/json" hidden>
<dialog id="dlg">
  <h2>📡 Feeds RSS</h2>
  <div id="feedlist"></div>
  <form id="ff" style="margin-top:12px">
    <input id="fu" type="url" inputmode="url" placeholder="URL del feed o del lloc…" autocomplete="off">
    <input id="ft" type="text" placeholder="Etiqueta (opcional)" autocomplete="off">
    <button class="add">Subscriu-m'hi</button>
  </form>
  <button class="close" id="dclose" type="button">Tanca</button>
</dialog>
<dialog id="sdlg">
  <div id="sbody"></div>
  <button class="close" data-act="close" type="button">Tanca</button>
</dialog>
<script>
const $=s=>document.querySelector(s);
const K={items:"discover.items.v1",feeds:"discover.feeds.v1",seen:"discover.seen.v1",sync:"discover.lastsync.v1",nofeed:"discover.nofeed.v1",set:"discover.settings.v1",col:"discover.tagcolors.v1"};
const ld=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch{return d}};
let items=ld(K.items,[]),feeds=ld(K.feeds,[]),seen=new Set(ld(K.seen,[])),nofeed=new Set(ld(K.nofeed,[]));
const DEF={theme:"auto",compact:false,autoOn:true,autoSite:false,rules:[],syncMin:30};
let S=Object.assign({},DEF,ld(K.set,{}));if(!Array.isArray(S.rules))S.rules=[];
let colors=ld(K.col,{});
items.forEach(i=>{if(!Array.isArray(i.tags))i.tags=[];seen.add(i.url)});
const saveItems=()=>localStorage.setItem(K.items,JSON.stringify(items));
const saveFeeds=()=>localStorage.setItem(K.feeds,JSON.stringify(feeds));
const saveSeen=()=>localStorage.setItem(K.seen,JSON.stringify([...seen].slice(-5000)));
const saveSet=()=>localStorage.setItem(K.set,JSON.stringify(S));
const saveCol=()=>localStorage.setItem(K.col,JSON.stringify(colors));
let nextId=Math.max(Date.now(),...items.map(i=>i.id||0));
const newId=()=>++nextId;
let filter="unread",shuffle=false,tag=null,q="";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"";
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const cleanTag=s=>String(s||"").trim().toLowerCase().replace(/^#/,"");
function applyLook(){document.documentElement.dataset.theme=S.theme==="auto"?"":S.theme;$("#feed").classList.toggle("compact",!!S.compact)}

/* ---------- colors i etiquetes ---------- */
const PAL=["#4f8cff","#7c5cff","#e0509f","#ef4444","#f59e0b","#22c55e","#14b8a6","#64748b"];
const hash=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const tagColor=t=>colors[t]||PAL[hash(t)%PAL.length];
const tagStyle=(t,on)=>{const c=tagColor(t);return on?`background:${c};border-color:${c};color:#fff`:`color:${c};border-color:${c}66;background:${c}1a`};
function autoTagsFor(it,feed){
 const t=[];
 if(feed&&feed.tag)t.push(feed.tag);
 if(S.autoOn){
  if(S.autoSite&&it.site){const s=slug(it.site);if(s)t.push(s)}
  const hay=norm([it.title,it.description,it.site].join(" "));
  for(const r of S.rules)if(r.k&&r.t&&hay.includes(norm(r.k)))t.push(r.t)}
 return[...new Set(t)]}
const tagCounts=()=>{const m={};items.forEach(i=>i.tags.forEach(t=>m[t]=(m[t]||0)+1));
 feeds.forEach(f=>{if(f.tag&&!m[f.tag])m[f.tag]=0});S.rules.forEach(r=>{if(r.t&&!m[r.t])m[r.t]=0});
 return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]))};

const chips=[["unread","Per a tu"],["all","Tot"],["starred","★ Preferits"],["shuffle","🔀 Barreja"],["search","🔍 Cerca"],["feeds","📡 Feeds"],["sync","⟳ Sincronitza"],["settings","⚙ Ajustos"]];
const ACTIONS=["search","feeds","sync","settings"];
function renderChips(){
 $("#chips").innerHTML=chips.map(([k,l])=>{
  const on=ACTIONS.includes(k)?(k==="search"&&(q||!$("#sbox").hidden)):(k===filter&&!(k==="shuffle"&&!shuffle));
  return`<button class="chip ${on?'on':''}" data-k="${k}">${l}</button>`}).join("");
 const all=[...new Set(items.flatMap(i=>i.tags))].sort();
 if(tag&&!all.includes(tag))tag=null;
 $("#tags").innerHTML=all.map(t=>`<button class="chip" style="${tagStyle(t,t===tag)}" data-t="${esc(t)}">#${esc(t)}</button>`).join("")}
$("#chips").onclick=e=>{const k=e.target.dataset.k;if(!k)return;
 if(k==="search"){const b=$("#sbox");b.hidden=!b.hidden;if(!b.hidden)$("#q").focus();renderChips();return}
 if(k==="feeds")return openFeeds();
 if(k==="sync")return syncFeeds(true);
 if(k==="settings")return openSettings();
 if(k==="shuffle"){shuffle=true;filter="unread"}else{shuffle=false;filter=k}
 renderChips();render()};
$("#tags").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tag=tag===t?null:t;renderChips();render()};
$("#q").oninput=e=>{q=e.target.value.trim();renderChips();render()};

function exportData(){const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([JSON.stringify({v:3,items,feeds,seen:[...seen],settings:S,colors})],{type:"application/json"}));
 a.download="discover-copia.json";a.click()}
$("#imp").onchange=async e=>{try{
 const d=JSON.parse(await e.target.files[0].text());
 const its=Array.isArray(d)?d:d.items||[];
 const have=new Set(items.map(i=>i.url));
 its.forEach(i=>{if(!have.has(i.url)){if(!Array.isArray(i.tags))i.tags=[];items.push(i);seen.add(i.url)}});
 (d.feeds||[]).forEach(f=>{if(!feeds.some(x=>x.url===f.url))feeds.push(f)});
 (d.seen||[]).forEach(u=>seen.add(u));
 if(d.settings)S=Object.assign({},DEF,d.settings);
 if(d.colors)colors=Object.assign({},d.colors,colors);
 saveItems();saveFeeds();saveSeen();saveSet();saveCol();applyLook();renderChips();render();toast("Restaurat")}catch{toast("Fitxer no vàlid")}};

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2400)}
function ago(ts){const s=Math.max(0,(Date.now()-ts)/1000);
 if(s<3600)return`fa ${Math.max(1,s/60|0)} min`;if(s<86400)return`fa ${s/3600|0} h`;
 if(s<2592000)return`fa ${s/86400|0} d`;return new Date(ts).toLocaleDateString("ca")}

/* ---------- xarxa ---------- */
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?"+encodeURIComponent(u)];
async function fetchText(url){
 for(const p of PROXIES){
  try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),10000);
   const r=await fetch(p(url),{signal:ctl.signal});clearTimeout(t);
   if(r.ok){const x=await r.text();if(x&&x.length>20)return x}}catch{}
 }
 return null}
const isFeed=t=>/<(rss|feed|rdf:RDF)[\s>]/i.test(t.slice(0,1500))&&!/<html[\s>]/i.test(t.slice(0,600));
function baseMeta(url){const host=new URL(url).hostname.replace(/^www\./,"");
 return{title:null,description:null,image:null,site:host,favicon:`https://www.google.com/s2/favicons?domain=${host}&sz=64`,feedUrl:null}}
function parseHtml(html,url){
 const out=baseMeta(url);
 const doc=new DOMParser().parseFromString(html,"text/html");
 const m=(...ns)=>{for(const n of ns){const el=doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`);
   if(el&&el.content&&el.content.trim())return el.content.trim()}return null};
 out.title=m("og:title","twitter:title")||(doc.title||"").trim()||null;
 out.description=m("og:description","twitter:description","description");
 const img=m("og:image","twitter:image","twitter:image:src");
 if(img){try{out.image=new URL(img,url).href}catch{}}
 out.site=m("og:site_name")||out.site;
 const fl=doc.querySelector('link[rel="alternate"][type*="rss"],link[rel="alternate"][type*="atom"]');
 if(fl&&fl.getAttribute("href")){try{out.feedUrl=new URL(fl.getAttribute("href"),url).href}catch{}}
 return out}
async function microlink(url){
 try{const r=await fetch("https://api.microlink.io/?url="+encodeURIComponent(url));
  const j=(await r.json()).data||{};return{title:j.title,description:j.description,image:j.image&&j.image.url}}catch{return{}}}
async function getMeta(url,text){
 if(text===undefined)text=await fetchText(url);
 const m=text&&!isFeed(text)?parseHtml(text,url):baseMeta(url);
 if(!m.title){const ml=await microlink(url);for(const k of["title","description","image"])m[k]=m[k]||ml[k]||null}
 if(!m.title)m.title=url;
 return m}

/* ---------- feeds ---------- */
const stripHtml=h=>(new DOMParser().parseFromString(h||"","text/html").body.textContent||"").replace(/\s+/g," ").trim();
function parseFeed(xml,feedUrl){
 const doc=new DOMParser().parseFromString(xml,"text/xml");
 if(doc.querySelector("parsererror")||!doc.documentElement)return null;
 const tag1=(el,n)=>{const e=el.getElementsByTagName(n)[0];return e?(e.textContent||"").trim():""};
 const root=doc.querySelector("channel")||doc.documentElement;
 const t=[...root.children].find(c=>c.tagName==="title");
 const entries=[...doc.getElementsByTagName("item"),...doc.getElementsByTagName("entry")].map(n=>{
  let link=tag1(n,"link");
  if(!link){const ls=[...n.getElementsByTagName("link")];
   const l=ls.find(x=>(x.getAttribute("rel")||"alternate")==="alternate")||ls[0];link=l?l.getAttribute("href")||"":""}
  try{link=new URL(link,feedUrl).href}catch{link=""}
  const rawHtml=tag1(n,"content:encoded")||tag1(n,"description")||tag1(n,"summary")||tag1(n,"content");
  const ie=n.getElementsByTagName("media:thumbnail")[0]
   ||[...n.getElementsByTagName("media:content")].find(x=>/image/.test((x.getAttribute("type")||"")+(x.getAttribute("medium")||"")))
   ||[...n.getElementsByTagName("enclosure")].find(x=>/^image/.test(x.getAttribute("type")||""));
  let image=ie?ie.getAttribute("url"):null;
  if(!image){const mm=/<img[^>]+src=["']([^"']+)["']/i.exec(rawHtml);if(mm)image=mm[1]}
  if(image){try{image=new URL(image,feedUrl).href}catch{image=null}}
  let date=Date.parse(tag1(n,"pubDate")||tag1(n,"published")||tag1(n,"updated")||tag1(n,"dc:date"));
  if(!date||date>Date.now())date=Date.now();
  return{url:link,title:tag1(n,"title"),description:stripHtml(rawHtml).slice(0,220),image,date}});
 return{title:t?t.textContent.trim():"",entries}}
async function subscribe(url,tg,text){
 if(text===undefined)text=await fetchText(url);
 if(!text)return toast("No he pogut obrir el feed");
 if(!isFeed(text)){
  const m=parseHtml(text,url);
  if(!m.feedUrl)return toast("No hi trobo cap feed RSS");
  url=m.feedUrl;text=await fetchText(url);
  if(!text||!isFeed(text))return toast("No hi trobo cap feed RSS")}
 if(feeds.some(f=>f.url===url))return toast("Ja hi estàs subscrit");
 const p=parseFeed(text,url);
 if(!p)return toast("Feed no vàlid");
 feeds.push({id:newId(),url,title:p.title,tag:cleanTag(tg),synced:false});
 saveFeeds();toast("Subscrit a "+(p.title||url));
 await syncFeeds(false);renderFeeds()}
let syncing=false;
async function syncFeeds(manual){
 if(syncing)return;
 if(!feeds.length){if(manual)toast("No tens feeds. Toca 📡 Feeds");return}
 syncing=true;toast("Sincronitzant…");let added=0;
 try{
  for(const f of feeds){
   const xml=await fetchText(f.url);if(!xml)continue;
   const p=parseFeed(xml,f.url);if(!p)continue;
   if(p.title&&!f.title)f.title=p.title;
   const fresh=p.entries.filter(e=>e.url&&!seen.has(e.url)).sort((a,b)=>b.date-a.date);
   const take=fresh.slice(0,f.synced?20:10);
   if(!f.synced)fresh.slice(10).forEach(e=>seen.add(e.url));
   f.synced=true;
   let lookups=0;
   for(const e of take){
    if(!e.image&&lookups<6){lookups++;const m=await getMeta(e.url);e.image=m.image;if(!e.description)e.description=m.description||""}
    const b=baseMeta(e.url);
    const it={id:newId(),url:e.url,title:e.title||e.url,description:e.description,image:e.image,site:f.title||b.site,favicon:b.favicon,added:e.date,read:false,starred:false,tags:[],feed:f.id};
    it.tags=autoTagsFor(it,f);
    items.push(it);seen.add(e.url);added++}
  }
 }finally{syncing=false}
 localStorage.setItem(K.sync,String(Date.now()));
 saveItems();saveFeeds();saveSeen();renderChips();render();
 toast(added?`${added} novetats`:"Res de nou")}
function renderFeeds(){
 $("#feedlist").innerHTML=feeds.length?feeds.map(f=>`<div class="fr"><span>${esc(f.title||f.url)}${f.tag?` · #${esc(f.tag)}`:""}<small>${esc(f.url)}</small></span><button data-delfeed="${f.id}">🗑</button></div>`).join(""):'<p class="hint">Encara no tens cap feed.</p>'}
function openFeeds(){renderFeeds();$("#dlg").showModal()}
$("#dclose").onclick=()=>$("#dlg").close();
$("#feedlist").onclick=e=>{const id=e.target.dataset.delfeed;if(!id)return;
 feeds=feeds.filter(f=>f.id!=id);saveFeeds();renderFeeds()};
$("#ff").onsubmit=async e=>{e.preventDefault();const u=$("#fu").value.trim(),t=$("#ft").value;if(!u)return;
 $("#fu").value="";$("#ft").value="";
 let url=u;if(!/^https?:\/\//i.test(url))url="https://"+url;
 toast("Subscrivint…");await subscribe(url,t)};

/* ---------- ajustos ---------- */
function renderSettings(){
 const opt=(cur,list)=>list.map(([v,l])=>`<option value="${v}" ${String(cur)===String(v)?"selected":""}>${l}</option>`).join("");
 const tc=tagCounts();
 $("#sbody").innerHTML=`
 <h2>⚙ Ajustos</h2>
 <h4>Aparença</h4>
 <label class="row">Tema <select data-set="theme">${opt(S.theme,[["auto","Automàtic"],["light","Clar"],["dark","Fosc"]])}</select></label>
 <label class="row">Targetes compactes <input type="checkbox" data-set="compact" ${S.compact?"checked":""}></label>
 <h4>Etiquetes automàtiques</h4>
 <label class="row">Activa-les <input type="checkbox" data-set="autoOn" ${S.autoOn?"checked":""}></label>
 <label class="row">Etiqueta amb el nom del lloc <input type="checkbox" data-set="autoSite" ${S.autoSite?"checked":""}></label>
 <p class="hint">Regles per paraules clau: si el títol o la descripció contenen la paraula, s'hi afegeix l'etiqueta.</p>
 ${S.rules.map((r,i)=>`<div class="fr"><span>«${esc(r.k)}» → #${esc(r.t)}</span><button data-act="delrule" data-i="${i}">🗑</button></div>`).join("")}
 <div class="rf"><input id="rk" type="text" placeholder="paraula"><input id="rt" type="text" placeholder="etiqueta"><button class="add" data-act="addrule">+</button></div>
 <button class="btn" data-act="applyrules">Aplica-ho a les targetes existents</button>
 <h4>Etiquetes: colors i noms</h4>
 ${tc.length?tc.map(([t,n])=>`<div class="tm"><div class="fr"><span><span class="tp" style="${tagStyle(t)}">#${esc(t)}</span> <small style="display:inline">${n}</small></span><span><button data-act="rename" data-tag="${esc(t)}">✏️</button><button data-act="deltag" data-tag="${esc(t)}">🗑</button></span></div><div class="swatch">${PAL.map(c=>`<button class="dot ${tagColor(t)===c?'sel':''}" style="background:${c}" data-act="color" data-tag="${esc(t)}" data-c="${c}" aria-label="color"></button>`).join("")}</div></div>`).join(""):'<p class="hint">Encara no hi ha etiquetes.</p>'}
 <h4>Sincronització</h4>
 <label class="row">Comprova els feeds cada <select data-set="syncMin">${opt(S.syncMin,[[15,"15 min"],[30,"30 min"],[60,"1 hora"],[120,"2 hores"]])}</select></label>
 <h4>Neteja</h4>
 <button class="btn" data-act="readall">Marca-ho tot com a llegit</button>
 <button class="btn" data-act="delread">Esborra les llegides (menys preferits)</button>
 <h4>Dades</h4>
 <button class="btn" data-act="export">⬇ Fes una còpia</button>
 <button class="btn" data-act="import">⬆ Restaura una còpia</button>
 <p class="hint">Discover v2.2 · 22/11/2026</p>`}
function openSettings(){renderSettings();$("#sdlg").showModal()}
function refreshAll(){saveItems();saveFeeds();saveSet();saveCol();renderChips();render();renderSettings()}
$("#sdlg").addEventListener("change",e=>{const k=e.target.dataset.set;if(!k)return;
 S[k]=e.target.type==="checkbox"?e.target.checked:(k==="syncMin"?Number(e.target.value):e.target.value);
 saveSet();applyLook()});
$("#sdlg").addEventListener("click",e=>{
 const b=e.target.closest("[data-act]");if(!b)return;const d=b.dataset;
 if(d.act==="close")return $("#sdlg").close();
 if(d.act==="export")return exportData();
 if(d.act==="import")return $("#imp").click();
 if(d.act==="addrule"){const k=$("#rk").value.trim(),t=cleanTag($("#rt").value);
  if(!k||!t)return toast("Cal una paraula i una etiqueta");
  S.rules.push({k,t});saveSet();return renderSettings()}
 if(d.act==="delrule"){S.rules.splice(Number(d.i),1);saveSet();return renderSettings()}
 if(d.act==="applyrules"){let c=0;
  items.forEach(i=>{const n=[...new Set([...i.tags,...autoTagsFor(i,feeds.find(f=>f.id===i.feed))])];
   if(n.length!==i.tags.length){i.tags=n;c++}});
  refreshAll();return toast(c+" targetes actualitzades")}
 if(d.act==="color"){colors[d.tag]=d.c;return refreshAll()}
 if(d.act==="rename"){const old=d.tag;const v=cleanTag(prompt("Nou nom per a #"+old,old));
  if(!v||v===old)return;
  items.forEach(i=>{if(i.tags.includes(old))i.tags=[...new Set(i.tags.map(x=>x===old?v:x))]});
  feeds.forEach(f=>{if(f.tag===old)f.tag=v});
  S.rules.forEach(r=>{if(r.t===old)r.t=v});
  if(colors[old]){if(!colors[v])colors[v]=colors[old];delete colors[old]}
  if(tag===old)tag=v;return refreshAll()}
 if(d.act==="deltag"){const old=d.tag;if(!confirm("Vols esborrar l'etiqueta #"+old+" de totes les targetes?"))return;
  items.forEach(i=>{i.tags=i.tags.filter(x=>x!==old)});
  feeds.forEach(f=>{if(f.tag===old)f.tag=""});
  S.rules=S.rules.filter(r=>r.t!==old);delete colors[old];
  if(tag===old)tag=null;return refreshAll()}
 if(d.act==="readall"){items.forEach(i=>i.read=true);refreshAll();return toast("Tot llegit")}
 if(d.act==="delread"){const n=items.filter(i=>i.read&&!i.starred).length;
  if(!n)return toast("No hi ha llegides");
  if(!confirm("Esborrar "+n+" targetes llegides?"))return;
  items=items.filter(i=>!i.read||i.starred);refreshAll();return toast(n+" esborrades")}
});

/* ---------- pàgines ---------- */
async function addUrl(raw){
 raw=raw.trim();if(!raw)return;
 if(!/^https?:\/\//i.test(raw))raw="https://"+raw;
 try{new URL(raw)}catch{return toast("Enllaç no vàlid")}
 if(items.some(i=>i.url===raw))return toast("Ja el tens");
 toast("Afegint…");
 const text=await fetchText(raw);
 if(text&&isFeed(text)){toast("És un feed RSS, em hi subscric");return subscribe(raw,"",text)}
 const m=await getMeta(raw,text);
 const it={id:newId(),url:raw,title:m.title,description:m.description,image:m.image,site:m.site,favicon:m.favicon,added:Date.now(),read:false,starred:false,tags:[]};
 it.tags=autoTagsFor(it,null);
 items.push(it);
 seen.add(raw);saveItems();saveSeen();filter="unread";shuffle=false;renderChips();render();toast("Afegit");
 if(m.feedUrl&&!feeds.some(f=>f.url===m.feedUrl)&&!nofeed.has(m.feedUrl)){
  if(confirm("Aquest lloc té un feed RSS:\n"+m.feedUrl+"\n\nVols subscriure-t'hi?"))await subscribe(m.feedUrl,"");
  else{nofeed.add(m.feedUrl);localStorage.setItem(K.nofeed,JSON.stringify([...nofeed]))}}
}
async function refreshItem(i){
 toast("Refrescant…");
 const m=await getMeta(i.url);
 if(m.title&&m.title!==i.url)i.title=m.title;
 i.description=m.description||i.description;i.image=m.image||i.image;i.site=m.site||i.site;i.favicon=m.favicon;
 saveItems();render();toast("Actualitzat")}
function editTags(i){
 const v=prompt("Etiquetes (separades per comes):",i.tags.join(", "));if(v===null)return;
 i.tags=[...new Set(v.split(",").map(cleanTag).filter(Boolean))];
 saveItems();renderChips();render()}

function render(){
 const nq=norm(q);
 let l=items.filter(i=>(filter==="all"||(filter==="starred"?i.starred:!i.read))&&(!tag||i.tags.includes(tag))
  &&(!nq||norm([i.title,i.description,i.site,i.tags.join(" ")].join(" ")).includes(nq)));
 l=shuffle?[...l].sort(()=>Math.random()-.5):[...l].sort((a,b)=>b.added-a.added);
 $("#feed").innerHTML=l.length?l.map(i=>`
 <article class="card ${i.read?'read':''}">
  <a href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener" data-open="${i.id}">
   ${i.image?`<div class="img" style="background-image:url('${esc(safeUrl(i.image))}')"></div>`:""}
   <div class="body">
    <div class="src"><img src="${esc(safeUrl(i.favicon))}" alt=""><span>${esc(i.site)} · ${ago(i.added)}</span></div>
    <h3>${esc(i.title)}</h3>${i.description?`<p>${esc(i.description)}</p>`:""}
   </div></a>
  ${i.tags.length?`<div class="tg">${i.tags.map(t=>`<span style="${tagStyle(t)}" data-ft="${esc(t)}">#${esc(t)}</span>`).join("")}</div>`:""}
  <div class="act"><button data-refresh="${i.id}" title="Refresca">↻</button><button data-tag="${i.id}" title="Etiquetes">🏷</button><button data-star="${i.id}">${i.starred?"★":"☆"}</button><button data-del="${i.id}">🗑</button></div>
 </article>`).join(""):`<div class="empty">Res per mostrar.<br>Enganxa un enllaç a dalt,<br>comparteix-lo des del Chrome<br>o subscriu-te a un feed (📡 Feeds).</div>`}
$("#feed").onclick=e=>{const t=e.target,d=t.dataset;const get=id=>items.find(x=>x.id==id);
 if(d.star){const i=get(d.star);i.starred=!i.starred;saveItems();render()}
 else if(d.del){items=items.filter(x=>x.id!=d.del);saveItems();renderChips();render()}
 else if(d.tag)editTags(get(d.tag));
 else if(d.refresh)refreshItem(get(d.refresh));
 else if(d.ft){tag=d.ft;renderChips();render()}
 else{const a=t.closest("[data-open]");if(a){const i=get(a.dataset.open);i.read=true;saveItems();a.closest(".card").classList.add("read")}}};
$("#f").onsubmit=async e=>{e.preventDefault();const v=$("#u").value;$("#u").value="";await addUrl(v)};

function autoSync(){if(feeds.length&&Date.now()-Number(localStorage.getItem(K.sync)||0)>S.syncMin*60*1000)syncFeeds(false)}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js?v=2.2");
document.addEventListener("visibilitychange",()=>{if(!document.hidden)autoSync()});
applyLook();renderChips();render();
// Comparteix → Discover (Android envia url/text/title)
const p=new URLSearchParams(location.search);
const shared=p.get("url")||p.get("text");
if(shared){history.replaceState(null,"",location.pathname);
 addUrl((shared.split(/\s+/).find(w=>/^https?:\/\//i.test(w)))||shared).then(autoSync)}
else autoSync();
</script>
